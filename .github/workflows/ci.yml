name: CI

on:
  push:
    branches: [master, develop, 'release/**', 'topic/**', 'fix/**']
  pull_request:
  workflow_dispatch:

# A push to a branch with an open pull request otherwise starts the same work
# twice, and each run holds two runners for as long as it takes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cross build with mingw-w64 and run the test suite under Wine.  This is the
  # same path developers use locally through tools/x, so a failure here is
  # reproducible on a macOS or Linux workstation.
  cross:
    name: mingw-w64 ${{ matrix.arch }} (Wine)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [i686, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Check the sources
        run: |
          tools/x check-encoding
          tools/x check-includes

      - name: Build the container image
        timeout-minutes: 30
        run: tools/x image

      - name: Configure
        timeout-minutes: 10
        run: tools/x configure ${{ matrix.arch }}

      - name: Build
        timeout-minutes: 30
        run: tools/x build ${{ matrix.arch }}

      # Reading the library as source costs more than ten minutes per start up,
      # so the byte compiled files are cached; only a change under lisp/ pays for
      # compiling them again.
      - name: Restore the byte compiled library
        id: lc
        uses: actions/cache/restore@v4
        with:
          path: lisp/**/*.lc
          key: lc-${{ matrix.arch }}-${{ hashFiles('lisp/**/*.l') }}

      - name: Byte compile the library
        if: steps.lc.outputs.cache-hit != 'true'
        timeout-minutes: 75
        run: tools/x bytecompile ${{ matrix.arch }}

      # Save it here rather than in a post step.  A post step does not run when
      # the job is cancelled or hits its timeout, which is how forty minutes of
      # byte compiling was being repeated on every single run.
      - name: Save the byte compiled library
        if: steps.lc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: lisp/**/*.lc
          key: lc-${{ matrix.arch }}-${{ hashFiles('lisp/**/*.l') }}

      - name: Start up and evaluate lisp
        timeout-minutes: 15
        run: tools/x smoke ${{ matrix.arch }} 300

      # run-tests.sh gives up on its own when the suite stops making progress,
      # so this cap is only a backstop.
      - name: Run the test suite
        timeout-minutes: 25
        env:
          XYZZY_TEST_TIMEOUT: 900
          XYZZY_TEST_STALL: 180
        run: tools/x test ${{ matrix.arch }}

      - name: Collect artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.arch }}
          path: |
            _build/${{ matrix.arch }}/run/test-report.txt
            _build/${{ matrix.arch }}/run/test-progress.txt
            _build/${{ matrix.arch }}/smoke.png
            _build/${{ matrix.arch }}/test-stuck.png
            _build/${{ matrix.arch }}/run/xyzzy.BUG
          if-no-files-found: ignore
