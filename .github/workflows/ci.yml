name: CI

on:
  push:
    branches: [master, develop, 'release/**', 'topic/**', 'fix/**']
  pull_request:
  workflow_dispatch:

jobs:
  # Cross build with mingw-w64 and run the test suite under Wine.  This is the
  # same path developers use locally through tools/x, so a failure here is
  # reproducible on a macOS or Linux workstation.
  cross:
    name: mingw-w64 ${{ matrix.arch }} (Wine)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [i686, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Check the sources
        run: |
          tools/x check-encoding
          tools/x check-includes

      - name: Build the container image
        run: tools/x image

      - name: Configure
        run: tools/x configure ${{ matrix.arch }}

      - name: Build
        run: tools/x build ${{ matrix.arch }}

      # Reading the library as source costs more than ten minutes per start up,
      # so the byte compiled files are cached; only a change under lisp/ pays for
      # compiling them again.
      - name: Restore the byte compiled library
        id: lc
        uses: actions/cache@v4
        with:
          path: lisp/**/*.lc
          key: lc-${{ matrix.arch }}-${{ hashFiles('lisp/**/*.l') }}

      - name: Byte compile the library
        if: steps.lc.outputs.cache-hit != 'true'
        timeout-minutes: 75
        run: tools/x bytecompile ${{ matrix.arch }}

      - name: Start up and evaluate lisp
        run: tools/x smoke ${{ matrix.arch }} 300

      - name: Run the test suite
        env:
          XYZZY_TEST_TIMEOUT: 1800
        run: tools/x test ${{ matrix.arch }}

      - name: Collect artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.arch }}
          path: |
            _build/${{ matrix.arch }}/run/test-report.txt
            _build/${{ matrix.arch }}/smoke.png
            _build/${{ matrix.arch }}/run/xyzzy.BUG
          if-no-files-found: ignore
