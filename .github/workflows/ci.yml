name: CI

on:
  # Topic branches are covered through their pull request: a push to the head
  # branch fires pull_request as well, and listing the branch here too would
  # start the same work twice, each run holding two runners for as long as it
  # takes.  workflow_dispatch covers a branch without a pull request.
  push:
    branches: [master, develop]
  pull_request:
  workflow_dispatch:

# github.ref is refs/pull/N/merge for a pull request and refs/heads/... for a
# push, so grouping on it would not put the two in the same group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Cross build with mingw-w64 and run the test suite under Wine.  This is the
  # same path developers use locally through tools/x, so a failure here is
  # reproducible on a macOS or Linux workstation.
  cross:
    name: mingw-w64 ${{ matrix.arch }} (Wine)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: [i686, x86_64]
    steps:
      - uses: actions/checkout@v4

      - name: Check the sources
        run: |
          tools/x check-encoding
          tools/x check-includes

      - name: Build the container image
        timeout-minutes: 30
        run: tools/x image

      - name: Configure
        timeout-minutes: 10
        run: tools/x configure ${{ matrix.arch }}

      - name: Build
        timeout-minutes: 30
        run: tools/x build ${{ matrix.arch }}

      # Reading the library as source costs more than ten minutes per start up,
      # so the byte compiled files are cached; only a change under lisp/ pays for
      # compiling them again.
      - name: Restore the byte compiled library
        id: lc
        uses: actions/cache/restore@v4
        with:
          path: lisp/**/*.lc
          key: lc-${{ matrix.arch }}-${{ hashFiles('lisp/**/*.l') }}

      - name: Byte compile the library
        if: steps.lc.outputs.cache-hit != 'true'
        timeout-minutes: 75
        run: tools/x bytecompile ${{ matrix.arch }}

      # Save it here rather than in a post step.  A post step does not run when
      # the job is cancelled or hits its timeout, which is how forty minutes of
      # byte compiling was being repeated on every single run.
      - name: Save the byte compiled library
        if: steps.lc.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: lisp/**/*.lc
          key: lc-${{ matrix.arch }}-${{ hashFiles('lisp/**/*.l') }}

      - name: Start up and evaluate lisp
        timeout-minutes: 15
        run: tools/x smoke ${{ matrix.arch }} 300

      # run-tests.sh gives up on its own when the suite stops making progress,
      # so this cap is only a backstop.
      # Excluded because they drive Internet Explorer or WMI, neither of which
      # exists under Wine.  fix-ole-event-sink-load-typelib does not merely
      # fail: it trips "Assertion failed: src/lisp.h: 202" in a modal box and
      # then waits for someone to click it.  That assertion is a real bug (see
      # docs/cross-build.md) and not the reason it is skipped here.
      - name: Run the test suite
        timeout-minutes: 25
        env:
          XYZZY_TEST_TIMEOUT: 900
          XYZZY_TEST_STALL: 180
          XYZZY_TEST_EXCLUDE: >-
            test-ole-method*-args,
            test-ole-method*-named-args,
            fix-ole-event-sink-load-typelib,
            fix-ole-for-each,
            fix-ole-for-each-2
        run: tools/x test ${{ matrix.arch }}

      - name: Collect artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-${{ matrix.arch }}
          path: |
            _build/${{ matrix.arch }}/run/test-report.txt
            _build/${{ matrix.arch }}/run/test-progress.txt
            _build/${{ matrix.arch }}/smoke.png
            _build/${{ matrix.arch }}/test-stuck.png
            _build/${{ matrix.arch }}/run/xyzzy.BUG
          if-no-files-found: ignore
