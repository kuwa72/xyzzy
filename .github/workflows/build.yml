name: Build

on:
  push:
    branches: [ modern, develop ]
  pull_request:
    branches: [ modern, develop ]
  workflow_call:

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: ARM64
            runner: windows-11-arm
            vcpkg-triplet: arm64-windows-static-md
            artifact: xyzzy-arm64
          - arch: x64
            runner: windows-latest
            vcpkg-triplet: x64-windows-static-md
            artifact: xyzzy-amd64
          - arch: x86
            cmake-arch: Win32
            runner: windows-latest
            vcpkg-triplet: x86-windows-static-md
            artifact: xyzzy-x86-msvc

    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Install zlib via vcpkg
      run: |
        vcpkg install zlib:${{ matrix.vcpkg-triplet }}

    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A ${{ matrix.cmake-arch || matrix.arch }} `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg-triplet }}

    - name: Build
      run: cmake --build build --config Release

    - name: Show build results
      run: |
        Get-ChildItem build/Release/*.exe | ForEach-Object {
          "{0}: {1:N0} KB" -f $_.Name, ($_.Length / 1KB)
        }

    - name: Byte-compile Lisp files
      run: cmake --build build --config Release --target bytecompile

    - name: Verify byte-compile results
      run: |
        $lcFiles = Get-ChildItem -Recurse lisp/*.lc
        Write-Host "Found $($lcFiles.Count) .lc files"
        if ($lcFiles.Count -eq 0) { throw "No .lc files generated!" }
        $lcFiles | Select-Object -First 10 | ForEach-Object { Write-Host $_.Name }

    - name: Run unit tests (informational)
      continue-on-error: true
      timeout-minutes: 5
      run: |
        $env:XYZZYHOME = (Get-Location).Path
        $env:XYZZYINIFILE = ""
        $env:XYZZYCONFIGPATH = ""
        Remove-Item -ErrorAction SilentlyContinue build\Release\xyzzy-batch.wxp
        .\build\Release\xyzzy-batch.exe -q -load misc\run-tests-batch.l

    - name: Package
      run: |
        cd build
        cpack -C Release

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: build/xyzzy-*.zip

  build-x86:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW32
        install: >-
          mingw-w64-i686-gcc
          mingw-w64-i686-binutils
          mingw-w64-i686-cmake
          mingw-w64-i686-make
          mingw-w64-i686-zlib

    - name: Build
      shell: msys2 {0}
      run: |
        cmake -B build -G "MinGW Makefiles" \
          -DCMAKE_C_COMPILER=gcc \
          -DCMAKE_CXX_COMPILER=g++ \
          -DCMAKE_RC_COMPILER=windres \
          -DCMAKE_SYSTEM_NAME=Windows \
          -DCMAKE_BUILD_TYPE=Release
        cmake --build build -- -j$(nproc)

    - name: Show build results
      shell: msys2 {0}
      run: |
        file build/xyzzy.exe build/xyzzy-batch.exe build/xyzzy-cli.exe
        ls -lh build/*.exe

    - name: Byte-compile Lisp files
      shell: msys2 {0}
      run: cmake --build build --target bytecompile

    - name: Verify byte-compile results
      shell: msys2 {0}
      run: |
        count=$(find lisp -name '*.lc' | wc -l)
        echo "Found $count .lc files"
        if [ "$count" -eq 0 ]; then echo "No .lc files generated!"; exit 1; fi
        find lisp -name '*.lc' | head -10

    - name: Run unit tests (informational)
      continue-on-error: true
      timeout-minutes: 5
      shell: msys2 {0}
      run: |
        export XYZZYHOME=$(pwd)
        export XYZZYINIFILE=
        export XYZZYCONFIGPATH=
        rm -f build/xyzzy-batch.wxp
        ./build/xyzzy-batch.exe -q -load misc/run-tests-batch.l

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: xyzzy-x86
        path: |
          build/xyzzy.exe
          build/xyzzy-batch.exe
          build/xyzzy-cli.exe
