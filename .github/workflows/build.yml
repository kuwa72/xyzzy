name: Build

on:
  push:
    branches: [ modern, develop, ci-experiment ]
  pull_request:
    branches: [ modern, develop ]

jobs:
  build-arm64:
    runs-on: windows-11-arm

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: arm64

    - name: Install zlib via vcpkg
      run: |
        vcpkg install zlib:arm64-windows

    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A ARM64 `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=arm64-windows

    - name: Build
      run: cmake --build build --config Release

    - name: Show build results
      run: |
        Get-ChildItem build/Release/*.exe | ForEach-Object {
          "{0}: {1:N0} KB" -f $_.Name, ($_.Length / 1KB)
        }

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: xyzzy-arm64
        path: |
          build/Release/xyzzy.exe
          build/Release/xyzzycli.exe
          build/Release/xyzzyenv.exe
