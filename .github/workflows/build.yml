name: Build

# ふだんの開発は mingw ワークフロー (llvm-mingw + Wine、5-7 分) が見る。こちらは
# MSVC で 3 アーキを建てて 15-20 分かかるうえ、topic ブランチの一押しごとに待つ
# 価値は無い。上流互換とリリース物のためのものなので、統合先のブランチ、PR、
# タグ (release.yml が workflow_call で呼ぶ)、それと手で回したいときに動かす。
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_call:

# github.ref is refs/pull/N/merge for a pull request and refs/heads/... for a
# push, so grouping on it would not put the two in the same group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # Named explicitly, because the default name is every matrix value joined
    # together: adding known-failures to the matrix turned the check into
    # "build (ARM64, windows-11-arm, arm64-windows-static-md, xyzzy-arm64,
    # misc/known-failures/common.tx...".  A required status check is matched by
    # name, so a name that moves whenever the matrix gains a field is a name
    # that silently stops being required.
    name: MSVC ${{ matrix.arch }}
    strategy:
      # One architecture failing used to cancel the others, which hid whether
      # they were healthy: the x86 link error left x64 and ARM64 "cancelled".
      fail-fast: false
      matrix:
        # known-failures: the tests that already fail on this target, by name.
        # See misc/known-failures/README.md.  x86 passes the two 64 bit ones.
        include:
          - arch: ARM64
            runner: windows-11-arm
            vcpkg-triplet: arm64-windows-static-md
            artifact: xyzzy-arm64
            known-failures: misc/known-failures/common.txt,misc/known-failures/msvc.txt,misc/known-failures/msvc-64bit.txt
          - arch: x64
            runner: windows-latest
            vcpkg-triplet: x64-windows-static-md
            artifact: xyzzy-amd64
            known-failures: misc/known-failures/common.txt,misc/known-failures/msvc.txt,misc/known-failures/msvc-64bit.txt
          - arch: x86
            cmake-arch: Win32
            runner: windows-latest
            vcpkg-triplet: x86-windows-static-md
            artifact: xyzzy-x86
            known-failures: misc/known-failures/common.txt,misc/known-failures/msvc.txt

    runs-on: ${{ matrix.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.arch }}

    - name: Install zlib via vcpkg
      run: |
        vcpkg install zlib:${{ matrix.vcpkg-triplet }}

    - name: Configure CMake
      run: |
        cmake -B build -A ${{ matrix.cmake-arch || matrix.arch }} `
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg-triplet }}

    - name: Build
      run: cmake --build build --config Release

    - name: Show build results
      run: |
        Get-ChildItem build/Release/*.exe | ForEach-Object {
          "{0}: {1:N0} KB" -f $_.Name, ($_.Length / 1KB)
        }

    - name: Byte-compile Lisp files
      run: cmake --build build --config Release --target bytecompile

    # バイトコンパイルは xyzzy 自身を走らせる工程で、落ちるときはここで落ちる。
    # クラッシュログ (.BUG) と進捗ログを残しておかないと後から何も分からない。
    - name: Upload crash logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}-logs
        if-no-files-found: ignore
        path: |
          build/Release/*.BUG
          bytecompile-progress.log
          xyzzy_debug.log

    - name: Verify byte-compile results
      run: |
        $lcFiles = Get-ChildItem -Recurse lisp/*.lc
        Write-Host "Found $($lcFiles.Count) .lc files"
        if ($lcFiles.Count -eq 0) { throw "No .lc files generated!" }
        $lcFiles | Select-Object -First 10 | ForEach-Object { Write-Host $_.Name }

    # This gates the merge, and it gates the release: release.yml calls this
    # workflow, so a red suite stops a tag from being published.  It is not
    # "the suite passes" -- it does not, on either toolchain -- it is "nothing
    # fails that is not already written down in misc/known-failures".  A
    # failure names the test and says which of the two things happened: an
    # unlisted test failed, or a listed one started passing and its entry has
    # to come off the list.
    #
    # It also used to swallow its own result twice over: continue-on-error, and
    # Write-Host as the last command, which left $LASTEXITCODE unread.
    - name: Run unit tests
      timeout-minutes: 20
      env:
        XYZZY_TEST_KNOWN_FAILURES: ${{ matrix.known-failures }}
      run: |
        $env:XYZZYHOME = (Get-Location).Path
        $env:XYZZYINIFILE = ""
        $env:XYZZYCONFIGPATH = ""
        # A dump image holds absolute addresses from the binary that wrote it.
        Remove-Item -ErrorAction SilentlyContinue build\Release\xyzzy-batch.wxp
        & .\build\Release\xyzzy-batch.exe -q -load misc\run-tests-batch.l > test-output.txt 2>&1
        $code = $LASTEXITCODE
        Get-Content test-output.txt
        # A crash can exit 0, so the status alone would read a run that stopped
        # halfway as a pass.  The summary line is what says it got to the end.
        if (-not (Select-String -Path test-output.txt -Pattern 'Total \d+ tests' -Quiet)) {
          throw "no summary line in the output: the suite did not finish"
        }
        if ($code -ne 0) { exit $code }

    - name: Upload test output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}-tests
        if-no-files-found: ignore
        path: test-output.txt

    - name: Package
      run: |
        cd build
        cpack -C Release

    - name: Extract version
      id: version
      shell: pwsh
      run: |
        if ("${{ github.ref_name }}" -match '^v(.+)$') {
          $ver = $Matches[1]
        } else {
          $ver = (Select-String -Path CMakeLists.txt -Pattern 'project\(xyzzy VERSION (\S+)').Matches.Groups[1].Value
        }
        echo "VERSION=$ver" >> $env:GITHUB_ENV
        echo "Version: $ver"

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: build/xyzzy-*.zip

    - name: Install to staging directory
      run: |
        cmake --install build --config Release --prefix staging/xyzzy

    - name: Build installer
      run: |
        iscc /DAppVersion=${{ env.VERSION }} /DAppArch=${{ matrix.artifact == 'xyzzy-arm64' && 'arm64' || (matrix.artifact == 'xyzzy-amd64' && 'amd64' || 'x86') }} "/DSourceDir=${{ github.workspace }}\staging\xyzzy" installer\xyzzy.iss

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}-setup
        path: build/xyzzy-*-setup.exe
