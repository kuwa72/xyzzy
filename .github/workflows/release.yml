name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List artifacts
      run: find artifacts -type f | sort

    - name: Rename artifacts with architecture suffix
      run: |
        for dir in arm64 amd64 x86-msvc; do
          for f in artifacts/xyzzy-${dir}/*.zip; do
            base=$(basename "$f" .zip)
            mv "$f" "artifacts/xyzzy-${dir}/${base}-${dir}.zip"
          done
        done
        find artifacts -name '*.zip' | sort

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ github.ref_name }}" \
          --title "xyzzy ${{ github.ref_name }}" \
          --generate-notes \
          artifacts/xyzzy-arm64/*.zip \
          artifacts/xyzzy-amd64/*.zip \
          artifacts/xyzzy-x86-msvc/*.zip
