name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List artifacts
      run: find artifacts -type f | sort

    - name: Rename artifacts with architecture suffix
      run: |
        # ZIP files
        for dir in arm64 amd64 x86-msvc; do
          for f in artifacts/xyzzy-${dir}/*.zip; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .zip)
            mv "$f" "artifacts/xyzzy-${dir}/${base}-${dir}.zip"
          done
        done
        # x86 MinGW ZIP
        for f in artifacts/xyzzy-x86/*.zip; do
          [ -f "$f" ] || continue
          base=$(basename "$f" .zip)
          mv "$f" "artifacts/xyzzy-x86/${base}-x86.zip"
        done
        echo "=== All release files ==="
        find artifacts -name '*.zip' -o -name '*-setup.exe' | sort

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "${{ github.ref_name }}" \
          --title "xyzzy ${{ github.ref_name }}" \
          --generate-notes \
          artifacts/xyzzy-arm64/*.zip \
          artifacts/xyzzy-amd64/*.zip \
          artifacts/xyzzy-x86-msvc/*.zip \
          artifacts/xyzzy-x86/*.zip \
          artifacts/xyzzy-arm64-setup/*-setup.exe \
          artifacts/xyzzy-amd64-setup/*-setup.exe \
          artifacts/xyzzy-x86-msvc-setup/*-setup.exe \
          artifacts/xyzzy-x86-setup/*-setup.exe
